# main'e her push'ta uygulamanın web sürümünü derleyip GitHub Pages'e yayınlar.
# Adres: https://emredikimen.github.io/saran-tracker/
name: Web test deployu

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek deploy; yenisi gelince yarım kalanı iptal eder.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest
      - name: Web derlemesi
        run: npx expo export -p web
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
      # Pages'te /saran-tracker/archive gibi bir adres yenilenince 404.html sunulur;
      # tek sayfa uygulama oradan doğru ekranı açar.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
